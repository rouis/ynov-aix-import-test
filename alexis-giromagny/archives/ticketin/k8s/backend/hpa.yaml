apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: ticketin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Nécessite metrics-server dans le cluster (minikube addons enable metrics-server).
  # Sûr car le polling email est externalisé (CronJob) : scaler l'API ne duplique pas les tickets.
