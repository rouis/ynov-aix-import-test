apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ticketin

resources:
  - namespace.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - minio/pvc.yaml
  - minio/deployment.yaml
  - minio/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/hpa.yaml
  - backend/inbound-cronjob.yaml
  - backend/backup-pvc.yaml
  - backend/backup-cronjob.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - gateway.yaml
  - backend/httproute.yaml
  - frontend/httproute.yaml
  - redirect-httproute.yaml

# Tag des images applicatives. Au déploiement, remplacer "latest" par le SHA
# de commit produit par la CI (tag immuable) pour des rollouts/rollbacks fiables.
images:
  - name: ghcr.io/rookuro/ticketin-backend
    newTag: latest
  - name: ghcr.io/rookuro/ticketin-frontend
    newTag: latest
