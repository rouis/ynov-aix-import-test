name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA à (re)déployer — vide = dernier commit de main (utile pour un rollback)"
        required: false
        default: ""

# Sérialise les exécutions par branche : on annule les runs de PR redondants,
# mais jamais un run sur main — un déploiement en cours ne doit pas être interrompu.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  OWNER: rookuro

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        working-directory: backend
        run: npm run lint:ci
      - name: Test
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  build-push:
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            build_args: ""
          - name: frontend
            context: ./frontend
            build_args: NEXT_PUBLIC_API_URL=https://api.ticket-in.fr
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ticketin-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ticketin-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Push main (après build-push) ou déclenchement manuel. En manuel, build-push
    # est sauté (push uniquement) : !failure()/!cancelled() laisse passer un need sauté.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.ticket-in.fr
    steps:
      - name: Resolve target SHA
        id: target
        run: echo "sha=${{ (github.event_name == 'workflow_dispatch' && inputs.sha != '') && inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TARGET_SHA
          script: |
            set -e
            cd /opt/ticketin
            git fetch origin
            git reset --hard ${TARGET_SHA}
            cd k8s
            kustomize edit set image \
              ghcr.io/rookuro/ticketin-backend=ghcr.io/rookuro/ticketin-backend:${TARGET_SHA} \
              ghcr.io/rookuro/ticketin-frontend=ghcr.io/rookuro/ticketin-frontend:${TARGET_SHA}
            kubectl apply -k .
            kubectl -n ticketin rollout status deploy/backend --timeout=180s
            kubectl -n ticketin rollout status deploy/frontend --timeout=180s
